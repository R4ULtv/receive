[package]
name = "receive"
version = "0.1.0"
edition = "2024"
description = "A local desktop email client for Resend, built with GPUI Kit"
license = "MIT"
publish = false
default-run = "receive"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
gpui-kit = "=0.6.2"
html2text = "0.16"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "query", "rustls", "system-proxy"] }
resend-rs = { version = "0.32", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0
incremental = true

[profile.release]
lto = "thin"
strip = true
